name: Tiered C++ release validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cpp-tier-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cpp-tier-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spacecadet-msvc:
    name: Small / SpaceCadetPinball Release_2.1.0 / MSVC x64
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Clone stable release tag
        shell: pwsh
        run: |
          git clone --branch Release_2.1.0 --depth 1 https://github.com/k4zmu2a/SpaceCadetPinball.git target
          $head = (git -C target rev-parse HEAD).Trim()
          if ($head -ne '6a30ccbef12c7b7781ccf89788d77461fa20a90a') {
            throw "Release_2.1.0 resolved to unexpected commit: $head"
          }
          New-Item -ItemType Directory -Force reports/spacecadet-msvc | Out-Null
          "release=Release_2.1.0" | Set-Content reports/spacecadet-msvc/metadata.txt
          "commit=$head" | Add-Content reports/spacecadet-msvc/metadata.txt
          "tier=small" | Add-Content reports/spacecadet-msvc/metadata.txt
          "compiler=MSVC" | Add-Content reports/spacecadet-msvc/metadata.txt

      - name: Install SDL dependencies with vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = 'C:\vcpkg' }
          & "$vcpkgRoot\vcpkg.exe" install sdl2:x64-windows sdl2-mixer:x64-windows
          "vcpkg_root=$vcpkgRoot" | Add-Content reports/spacecadet-msvc/metadata.txt
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure and build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          cmake -S target -B target/build-msvc -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_WIN32_EXECUTABLE=ON
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            cmake --build target/build-msvc --config Release --parallel
            $code = $LASTEXITCODE
          }
          $sw.Stop()
          "build_seconds=$([math]::Round($sw.Elapsed.TotalSeconds,3))" | Add-Content reports/spacecadet-msvc/metadata.txt
          "build_exit_code=$code" | Add-Content reports/spacecadet-msvc/metadata.txt
          exit $code

      - name: Collect PE/PDB metrics
        if: always()
        shell: pwsh
        run: |
          ./scripts/collect-pe-metrics.ps1 -Root target -ExecutablePattern 'SpaceCadetPinball.exe' -OutDir reports/spacecadet-msvc -TargetName 'SpaceCadetPinball Release_2.1.0 MSVC x64'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spacecadet-Release_2.1.0-msvc-report
          path: reports/spacecadet-msvc

      - name: Preserve build failure status
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: exit 1

  spacecadet-mingw:
    name: Small / SpaceCadetPinball Release_2.1.0 / MinGW x64 O2+DWARF
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Clone stable release tag
        shell: pwsh
        run: |
          git clone --branch Release_2.1.0 --depth 1 https://github.com/k4zmu2a/SpaceCadetPinball.git target
          $head = (git -C target rev-parse HEAD).Trim()
          if ($head -ne '6a30ccbef12c7b7781ccf89788d77461fa20a90a') {
            throw "Release_2.1.0 resolved to unexpected commit: $head"
          }
          New-Item -ItemType Directory -Force reports/spacecadet-mingw | Out-Null
          "release=Release_2.1.0" | Set-Content reports/spacecadet-mingw/metadata.txt
          "commit=$head" | Add-Content reports/spacecadet-mingw/metadata.txt
          "tier=small" | Add-Content reports/spacecadet-mingw/metadata.txt
          "compiler=MinGW-w64 GCC" | Add-Content reports/spacecadet-mingw/metadata.txt

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_mixer

      - name: Configure and build with DWARF and preprocessed output
        id: build
        continue-on-error: true
        shell: msys2 {0}
        run: |
          start=$(date +%s)
          cmake -S target -B target/build-mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_WIN32_EXECUTABLE=ON \
            -DCMAKE_CXX_FLAGS_RELEASE='-O2 -g -save-temps=obj'
          code=$?
          if [ $code -eq 0 ]; then
            cmake --build target/build-mingw --parallel
            code=$?
          fi
          end=$(date +%s)
          echo "build_seconds=$((end-start))" >> reports/spacecadet-mingw/metadata.txt
          echo "build_exit_code=$code" >> reports/spacecadet-mingw/metadata.txt
          g++ --version | head -n 1 >> reports/spacecadet-mingw/metadata.txt
          exit $code

      - name: Collect PE/DWARF and .ii metrics
        if: always()
        shell: pwsh
        run: |
          $root = Get-Item target
          $exe = Get-ChildItem target -Recurse -File -Filter SpaceCadetPinball.exe -ErrorAction SilentlyContinue | Sort-Object Length -Descending | Select-Object -First 1
          $ii = @(Get-ChildItem target -Recurse -File -Filter *.ii -ErrorAction SilentlyContinue)
          $ii | Select-Object FullName,Length | Export-Csv -NoTypeInformation reports/spacecadet-mingw/preprocessed-files.csv
          "ii_count=$($ii.Count)" | Add-Content reports/spacecadet-mingw/metadata.txt
          "ii_bytes=$(($ii | Measure-Object Length -Sum).Sum)" | Add-Content reports/spacecadet-mingw/metadata.txt
          if ($exe) {
            "exe=$($exe.FullName.Substring($root.FullName.Length).TrimStart('\','/'))" | Add-Content reports/spacecadet-mingw/metadata.txt
            "exe_bytes=$($exe.Length)" | Add-Content reports/spacecadet-mingw/metadata.txt
            "sha256=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)" | Add-Content reports/spacecadet-mingw/metadata.txt
            $objdump = 'C:\msys64\mingw64\bin\objdump.exe'
            if (Test-Path $objdump) {
              $dwarf = & $objdump --dwarf=info $exe.FullName 2>$null
              "dwarf_subprogram_count=$(@($dwarf | Select-String 'DW_TAG_subprogram').Count)" | Add-Content reports/spacecadet-mingw/metadata.txt
            }
          }

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spacecadet-Release_2.1.0-mingw-report
          path: reports/spacecadet-mingw

      - name: Preserve build failure status
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: exit 1

  powder-toy-mingw:
    name: Medium / The Powder Toy v100.0.399 / MinGW x64 O2+DWARF
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Clone stable release tag
        shell: pwsh
        run: |
          git clone --branch v100.0.399 --depth 1 https://github.com/The-Powder-Toy/The-Powder-Toy.git target
          $head = (git -C target rev-parse HEAD).Trim()
          if ($head -ne '9c94feba3ed5eaa75a819ac000c0d29e4ce92570') {
            throw "v100.0.399 resolved to unexpected commit: $head"
          }
          git -C target submodule update --init --recursive
          New-Item -ItemType Directory -Force reports/powder-toy-mingw | Out-Null
          "release=v100.0.399" | Set-Content reports/powder-toy-mingw/metadata.txt
          "commit=$head" | Add-Content reports/powder-toy-mingw/metadata.txt
          "tier=medium" | Add-Content reports/powder-toy-mingw/metadata.txt
          "compiler=MinGW-w64 GCC" | Add-Content reports/powder-toy-mingw/metadata.txt

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja

      - name: Configure and build
        id: build
        continue-on-error: true
        shell: msys2 {0}
        run: |
          start=$(date +%s)
          export CXXFLAGS='-O2 -g -save-temps=obj'
          manifest_date=$(date +%Y-%m-%d)
          meson setup target/build-mingw target \
            --buildtype=release \
            -Dstatic=prebuilt \
            -Dlto=false \
            -Dresolve_vcs_tag=no \
            -Dmanifest_date=$manifest_date
          code=$?
          if [ $code -eq 0 ]; then
            meson compile -C target/build-mingw
            code=$?
          fi
          end=$(date +%s)
          echo "build_seconds=$((end-start))" >> reports/powder-toy-mingw/metadata.txt
          echo "build_exit_code=$code" >> reports/powder-toy-mingw/metadata.txt
          g++ --version | head -n 1 >> reports/powder-toy-mingw/metadata.txt
          exit $code

      - name: Collect PE/DWARF and .ii metrics
        if: always()
        shell: pwsh
        run: |
          $root = Get-Item target
          $exe = Get-ChildItem target/build-mingw -Recurse -File -Filter powder.exe -ErrorAction SilentlyContinue | Sort-Object Length -Descending | Select-Object -First 1
          $ii = @(Get-ChildItem target/build-mingw -Recurse -File -Filter *.ii -ErrorAction SilentlyContinue)
          $ii | Select-Object FullName,Length | Export-Csv -NoTypeInformation reports/powder-toy-mingw/preprocessed-files.csv
          "ii_count=$($ii.Count)" | Add-Content reports/powder-toy-mingw/metadata.txt
          "ii_bytes=$(($ii | Measure-Object Length -Sum).Sum)" | Add-Content reports/powder-toy-mingw/metadata.txt
          if ($exe) {
            "exe=$($exe.FullName.Substring($root.FullName.Length).TrimStart('\','/'))" | Add-Content reports/powder-toy-mingw/metadata.txt
            "exe_bytes=$($exe.Length)" | Add-Content reports/powder-toy-mingw/metadata.txt
            "sha256=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)" | Add-Content reports/powder-toy-mingw/metadata.txt
            $objdump = 'C:\msys64\mingw64\bin\objdump.exe'
            if (Test-Path $objdump) {
              $dwarf = & $objdump --dwarf=info $exe.FullName 2>$null
              "dwarf_subprogram_count=$(@($dwarf | Select-String 'DW_TAG_subprogram').Count)" | Add-Content reports/powder-toy-mingw/metadata.txt
            }
          }

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powder-toy-v100.0.399-mingw-report
          path: reports/powder-toy-mingw

      - name: Preserve build failure status
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: exit 1

  explorerplusplus-msvc:
    name: Medium / Explorer++ version-1.4.0 / MSVC x64
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Clone stable release tag and submodules
        shell: pwsh
        run: |
          git clone --branch version-1.4.0 --depth 1 https://github.com/derceg/explorerplusplus.git target
          $head = (git -C target rev-parse HEAD).Trim()
          if ($head -ne '384c2f687fd55c1e71e9fcb272f9113de009a248') {
            throw "version-1.4.0 resolved to unexpected commit: $head"
          }
          git -C target submodule update --init --recursive
          New-Item -ItemType Directory -Force reports/explorerplusplus | Out-Null
          "release=version-1.4.0" | Set-Content reports/explorerplusplus/metadata.txt
          "commit=$head" | Add-Content reports/explorerplusplus/metadata.txt
          "tier=medium" | Add-Content reports/explorerplusplus/metadata.txt
          "compiler=MSVC" | Add-Content reports/explorerplusplus/metadata.txt

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: explorerplusplus-1.4.0-vcpkg-${{ hashFiles('target/vcpkg.json', 'target/vcpkg-configuration.json') }}

      - name: Bootstrap vcpkg
        shell: pwsh
        run: target\Explorer++\ThirdParty\vcpkg\bootstrap-vcpkg.bat

      - name: Build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          msbuild target\Explorer++\Explorer++.sln /m /p:Configuration=Release /p:Platform=x64 /p:ExplorerPlusPlusBuildVersion=0 /v:minimal
          $code = $LASTEXITCODE
          $sw.Stop()
          "build_seconds=$([math]::Round($sw.Elapsed.TotalSeconds,3))" | Add-Content reports/explorerplusplus/metadata.txt
          "build_exit_code=$code" | Add-Content reports/explorerplusplus/metadata.txt
          exit $code

      - name: Collect PE/PDB metrics
        if: always()
        shell: pwsh
        run: |
          ./scripts/collect-pe-metrics.ps1 -Root target -ExecutablePattern 'Explorer++.exe' -OutDir reports/explorerplusplus -TargetName 'Explorer++ version-1.4.0 MSVC x64'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorerplusplus-version-1.4.0-msvc-report
          path: reports/explorerplusplus

      - name: Preserve build failure status
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: exit 1

  notepadplusplus-msvc:
    name: Large / Notepad++ v8.9.6.1 / MSVC x64
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Clone stable release tag
        shell: pwsh
        run: |
          git clone --branch v8.9.6.1 --depth 1 https://github.com/notepad-plus-plus/notepad-plus-plus.git target
          $head = (git -C target rev-parse HEAD).Trim()
          if ($head -ne '41dd976310db0ba551bb8a2810b60331df3a77f5') {
            throw "v8.9.6.1 resolved to unexpected commit: $head"
          }
          New-Item -ItemType Directory -Force reports/notepadplusplus-msvc | Out-Null
          "release=v8.9.6.1" | Set-Content reports/notepadplusplus-msvc/metadata.txt
          "commit=$head" | Add-Content reports/notepadplusplus-msvc/metadata.txt
          "tier=large" | Add-Content reports/notepadplusplus-msvc/metadata.txt
          "compiler=MSVC" | Add-Content reports/notepadplusplus-msvc/metadata.txt

      - name: Build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          msbuild target\PowerEditor\visual.net\notepadPlus.sln /m /p:configuration=Release /p:platform=x64
          $code = $LASTEXITCODE
          $sw.Stop()
          "build_seconds=$([math]::Round($sw.Elapsed.TotalSeconds,3))" | Add-Content reports/notepadplusplus-msvc/metadata.txt
          "build_exit_code=$code" | Add-Content reports/notepadplusplus-msvc/metadata.txt
          exit $code

      - name: Collect PE/PDB metrics
        if: always()
        shell: pwsh
        run: |
          ./scripts/collect-pe-metrics.ps1 -Root target -ExecutablePattern 'Notepad++.exe' -OutDir reports/notepadplusplus-msvc -TargetName 'Notepad++ v8.9.6.1 MSVC x64'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notepadplusplus-v8.9.6.1-msvc-report
          path: reports/notepadplusplus-msvc

      - name: Preserve build failure status
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: exit 1

  notepadplusplus-mingw:
    name: Large / Notepad++ v8.9.6.1 / MinGW x64 O2+DWARF
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Clone stable release tag
        shell: pwsh
        run: |
          git clone --branch v8.9.6.1 --depth 1 https://github.com/notepad-plus-plus/notepad-plus-plus.git target
          $head = (git -C target rev-parse HEAD).Trim()
          if ($head -ne '41dd976310db0ba551bb8a2810b60331df3a77f5') {
            throw "v8.9.6.1 resolved to unexpected commit: $head"
          }
          New-Item -ItemType Directory -Force reports/notepadplusplus-mingw | Out-Null
          "release=v8.9.6.1" | Set-Content reports/notepadplusplus-mingw/metadata.txt
          "commit=$head" | Add-Content reports/notepadplusplus-mingw/metadata.txt
          "tier=large" | Add-Content reports/notepadplusplus-mingw/metadata.txt
          "compiler=MinGW-w64 GCC" | Add-Content reports/notepadplusplus-mingw/metadata.txt

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make

      - name: Instrument upstream release makefile for O2 + DWARF + .ii
        shell: pwsh
        run: |
          $path = 'target\PowerEditor\gcc\makefile'
          $text = Get-Content $path -Raw
          $text = $text -replace 'CXXFLAGS \+= -O3', 'CXXFLAGS += -O2 -g -save-temps=obj'
          $text = $text -replace 'LDFLAGS \+= -s', '# LDFLAGS += -s  # disabled by DecBench validation harness to preserve DWARF'
          Set-Content -Path $path -Value $text -Encoding UTF8

      - name: Build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $env:MSYSTEM = 'MINGW64'
          $env:Path = 'C:\msys64\usr\bin;' + 'C:\msys64\mingw64\bin;' + $env:Path
          Push-Location target
          mingw32-make -f PowerEditor\gcc\makefile -j2
          $code = $LASTEXITCODE
          Pop-Location
          $sw.Stop()
          "build_seconds=$([math]::Round($sw.Elapsed.TotalSeconds,3))" | Add-Content reports/notepadplusplus-mingw/metadata.txt
          "build_exit_code=$code" | Add-Content reports/notepadplusplus-mingw/metadata.txt
          g++ --version | Select-Object -First 1 | Add-Content reports/notepadplusplus-mingw/metadata.txt
          exit $code

      - name: Collect PE/DWARF and .ii metrics
        if: always()
        shell: pwsh
        run: |
          $root = Get-Item target
          $exe = Get-ChildItem target -Recurse -File -Filter Notepad++.exe -ErrorAction SilentlyContinue | Sort-Object Length -Descending | Select-Object -First 1
          $ii = @(Get-ChildItem target -Recurse -File -Filter *.ii -ErrorAction SilentlyContinue)
          $ii | Select-Object FullName,Length | Export-Csv -NoTypeInformation reports/notepadplusplus-mingw/preprocessed-files.csv
          "ii_count=$($ii.Count)" | Add-Content reports/notepadplusplus-mingw/metadata.txt
          "ii_bytes=$(($ii | Measure-Object Length -Sum).Sum)" | Add-Content reports/notepadplusplus-mingw/metadata.txt
          if ($exe) {
            "exe=$($exe.FullName.Substring($root.FullName.Length).TrimStart('\','/'))" | Add-Content reports/notepadplusplus-mingw/metadata.txt
            "exe_bytes=$($exe.Length)" | Add-Content reports/notepadplusplus-mingw/metadata.txt
            "sha256=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)" | Add-Content reports/notepadplusplus-mingw/metadata.txt
            $objdump = 'C:\msys64\mingw64\bin\objdump.exe'
            if (Test-Path $objdump) {
              $dwarf = & $objdump --dwarf=info $exe.FullName 2>$null
              "dwarf_subprogram_count=$(@($dwarf | Select-String 'DW_TAG_subprogram').Count)" | Add-Content reports/notepadplusplus-mingw/metadata.txt
            }
          }

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notepadplusplus-v8.9.6.1-mingw-report
          path: reports/notepadplusplus-mingw

      - name: Preserve build failure status
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: exit 1
