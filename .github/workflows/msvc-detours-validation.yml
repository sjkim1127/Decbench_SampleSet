name: Detours native MSVC qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/msvc-detours-validation.yml"
      - "scripts/validate_detours_msvc.ps1"
      - "targets/windows/detours.toml"

permissions:
  contents: read

concurrency:
  group: detours-msvc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: ${{ matrix.mode }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [O0, O2, O2-noinline]

    env:
      DETOURS_REF: e4bfd6b03e50de46b47abfbd1e46b384f0c5f833
      EVIDENCE_ROOT: msvc-evidence/${{ matrix.mode }}

    steps:
      - name: Checkout qualification workspace
        uses: actions/checkout@v4

      - name: Checkout pinned Detours
        uses: actions/checkout@v4
        with:
          repository: microsoft/Detours
          ref: ${{ env.DETOURS_REF }}
          path: detours
          fetch-depth: 1

      - name: Verify pinned source revision
        shell: pwsh
        run: |
          $actual = (git -C detours rev-parse HEAD).Trim()
          if ($actual -ne $env:DETOURS_REF) {
            throw "Detours revision mismatch: expected $env:DETOURS_REF, got $actual"
          }
          "Detours revision: $actual"

      - name: Build and qualify with native MSVC x64
        shell: cmd
        run: |
          @echo on
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          where cl
          where link
          where nmake
          where llvm-pdbutil
          where llvm-readobj
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts\validate_detours_msvc.ps1 -Mode "${{ matrix.mode }}" -DetoursRoot detours -EvidenceRoot "%EVIDENCE_ROOT%"

      - name: Record runner environment
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:EVIDENCE_ROOT | Out-Null
          @(
            "GitHub Actions native MSVC Detours qualification",
            "===============================================",
            "Runner OS: $env:RUNNER_OS",
            "Runner arch: $env:RUNNER_ARCH",
            "Image OS: $env:ImageOS",
            "Image version: $env:ImageVersion",
            "Detours revision: $env:DETOURS_REF",
            "Workflow commit: $env:GITHUB_SHA",
            "Optimization: ${{ matrix.mode }}"
          ) | Set-Content -Encoding utf8 "$env:EVIDENCE_ROOT/environment.txt"

      - name: Upload Detours MSVC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detours-msvc-${{ matrix.mode }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 30
