name: WinSparkle native MSVC qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/msvc-winsparkle-validation.yml"
      - "scripts/validate_winsparkle_msvc.ps1"
      - "scripts/qualify_msvc_pdb.ps1"
      - "targets/windows/winsparkle.toml"

permissions:
  contents: write

concurrency:
  group: winsparkle-msvc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: ${{ matrix.mode }}
    runs-on: windows-2025
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        mode: [O0, O2, O2-noinline]

    env:
      WINSPARKLE_REF: a8986caf620262f7d4581b241436ceaa0cc9370f
      EVIDENCE_ROOT: msvc-evidence/winsparkle/${{ matrix.mode }}

    steps:
      - name: Checkout qualification workspace
        uses: actions/checkout@v4

      - name: Checkout pinned WinSparkle with submodules
        uses: actions/checkout@v4
        with:
          repository: vslavik/winsparkle
          ref: ${{ env.WINSPARKLE_REF }}
          path: winsparkle
          fetch-depth: 1
          submodules: recursive

      - name: Verify pinned source revision
        shell: pwsh
        run: |
          $actual = (git -C winsparkle rev-parse HEAD).Trim()
          if ($actual -ne $env:WINSPARKLE_REF) {
            throw "WinSparkle revision mismatch: expected $env:WINSPARKLE_REF, got $actual"
          }
          "WinSparkle revision: $actual"
          git -C winsparkle submodule status --recursive

      - name: Build and qualify with native MSVC x64
        shell: cmd
        run: |
          @echo on
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          where cl
          where link
          where msbuild
          where nuget
          where llvm-pdbutil
          where llvm-readobj
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts\validate_winsparkle_msvc.ps1 -Mode "${{ matrix.mode }}" -SourceRoot winsparkle -EvidenceRoot "%EVIDENCE_ROOT%"

      - name: Record runner environment
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:EVIDENCE_ROOT | Out-Null
          @(
            "GitHub Actions native MSVC WinSparkle qualification",
            "=================================================",
            "Runner OS: $env:RUNNER_OS",
            "Runner arch: $env:RUNNER_ARCH",
            "Image OS: $env:ImageOS",
            "Image version: $env:ImageVersion",
            "WinSparkle revision: $env:WINSPARKLE_REF",
            "Workflow commit: $env:GITHUB_SHA",
            "Optimization: ${{ matrix.mode }}"
          ) | Set-Content -Encoding utf8 "$env:EVIDENCE_ROOT/environment.txt"

      - name: Upload WinSparkle MSVC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winsparkle-msvc-${{ matrix.mode }}
          path: ${{ env.EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 30

  publish-evidence:
    name: Persist WinSparkle run summary
    needs: qualify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      QUALIFY_RESULT: ${{ needs.qualify.result }}
      WINSPARKLE_REF: a8986caf620262f7d4581b241436ceaa0cc9370f
    steps:
      - name: Checkout qualification workspace
        uses: actions/checkout@v4

      - name: Download WinSparkle evidence artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: winsparkle-msvc-*
          path: collected

      - name: Build permanent or failure summary
        shell: python
        run: |
          import json
          import os
          import re
          from pathlib import Path

          modes = ["O0", "O2", "O2-noinline"]
          base = Path("results/evidence/msvc/winsparkle")
          base.mkdir(parents=True, exist_ok=True)
          success_path = base / "qualification-summary.json"
          failure_path = base / "latest-failure.json"

          if os.environ["QUALIFY_RESULT"] == "success":
              rows = []
              for mode in modes:
                  path = Path("collected") / f"winsparkle-msvc-{mode}" / "qualification.json"
                  if not path.is_file():
                      raise SystemExit(f"missing qualification evidence: {path}")
                  row = json.loads(path.read_text(encoding="utf-8-sig"))
                  if row.get("optimization") != mode:
                      raise SystemExit(f"optimization mismatch in {path}: {row.get('optimization')}")
                  if row.get("architecture") != "x86_64":
                      raise SystemExit(f"architecture mismatch in {path}: {row.get('architecture')}")
                  if row.get("pdb_ltcg_compile3_records_selected") != 0:
                      raise SystemExit(f"LTCG evidence present in {path}")
                  rows.append(row)

              out = {
                  "schema": "decbench-native-msvc-pdb-qualification-summary-v1",
                  "target": "WinSparkle v0.9.4",
                  "revision": os.environ["WINSPARKLE_REF"],
                  "architecture": "x86_64",
                  "ground_truth": "native MSVC PDB / CodeView",
                  "workflow_run_id": os.environ["GITHUB_RUN_ID"],
                  "workflow_commit": os.environ["GITHUB_SHA"],
                  "modes": rows,
                  "caveats": [
                      "All three optimization modes passed the native MSVC/PDB target-oracle qualification gates.",
                      "PDB raw-name collision is a CodeView diagnostic and is not asserted to be numerically equivalent to DecBench DWARF DW_AT_name collision.",
                      "This evidence is target/oracle qualification, not an end-to-end DecBench GED/type/byte benchmark run."
                  ]
              }
              success_path.write_text(json.dumps(out, indent=2) + "\n", encoding="utf-8")
              failure_path.unlink(missing_ok=True)
          else:
              diagnostics = []
              mod_re = re.compile(r"^\s*Mod\s+\d+\s+\|\s+`([^`]+)`")
              for mode in modes:
                  root = Path("collected") / f"winsparkle-msvc-{mode}"
                  qual = root / "qualification.json"
                  modules = root / "raw" / "pdb-modules-files.txt"
                  module_samples = []
                  if modules.is_file():
                      for line in modules.read_text(encoding="utf-8-sig", errors="replace").splitlines():
                          m = mod_re.match(line)
                          if m:
                              module_samples.append(m.group(1))
                              if len(module_samples) >= 30:
                                  break
                  diagnostics.append({
                      "optimization": mode,
                      "qualification_json_present": qual.is_file(),
                      "pdb_modules_dump_present": modules.is_file(),
                      "module_name_samples": module_samples
                  })
              out = {
                  "schema": "decbench-native-msvc-pdb-qualification-failure-v1",
                  "target": "WinSparkle v0.9.4",
                  "revision": os.environ["WINSPARKLE_REF"],
                  "workflow_run_id": os.environ["GITHUB_RUN_ID"],
                  "workflow_commit": os.environ["GITHUB_SHA"],
                  "qualify_result": os.environ["QUALIFY_RESULT"],
                  "modes": diagnostics,
                  "note": "Failure metadata only; this file does not mark the target as validated."
              }
              failure_path.write_text(json.dumps(out, indent=2) + "\n", encoding="utf-8")

      - name: Commit run evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A results/evidence/msvc/winsparkle
          if git diff --cached --quiet; then
            echo "WinSparkle run evidence is unchanged"
            exit 0
          fi
          if [ "$QUALIFY_RESULT" = "success" ]; then
            git commit -m "results: persist WinSparkle MSVC qualification evidence"
          else
            git commit -m "ci: record failed WinSparkle qualification run"
          fi
          git push origin HEAD:main
