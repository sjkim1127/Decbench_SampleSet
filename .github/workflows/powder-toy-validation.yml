name: The Powder Toy release validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/powder-toy-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/powder-toy-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powder-toy:
    name: The Powder Toy v100.0.399 / MSVC x64 O2+LTO
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Meson and Ninja
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson ninja

      - name: Clone stable release tag
        shell: pwsh
        run: |
          git clone --branch v100.0.399 --depth 1 https://github.com/The-Powder-Toy/The-Powder-Toy.git target
          $head = (git -C target rev-parse HEAD).Trim()
          if ($head -ne '9c94feba3ed5eaa75a819ac000c0d29e4ce92570') {
            throw "v100.0.399 resolved to unexpected commit: $head"
          }
          git -C target submodule update --init --recursive
          New-Item -ItemType Directory -Force reports/powder-toy | Out-Null
          "release=v100.0.399" | Set-Content reports/powder-toy/metadata.txt
          "commit=$head" | Add-Content reports/powder-toy/metadata.txt
          "submodules=$(@(git -C target submodule status --recursive).Count)" | Add-Content reports/powder-toy/metadata.txt
          $bytes = (Get-ChildItem target -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
          "clone_bytes=$bytes" | Add-Content reports/powder-toy/metadata.txt
          python --version | Add-Content reports/powder-toy/metadata.txt
          meson --version | Add-Content reports/powder-toy/metadata.txt
          ninja --version | Add-Content reports/powder-toy/metadata.txt
          cl 2>&1 | Select-Object -First 3 | Add-Content reports/powder-toy/metadata.txt

      - name: Configure and build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $manifestDate = Get-Date -Format 'yyyy-MM-dd'
          meson setup target/build-ci target `
            --buildtype=debugoptimized `
            -Dstatic=prebuilt `
            -Dlto=true `
            -Dresolve_vcs_tag=no `
            -Dmanifest_date=$manifestDate
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            meson compile -C target/build-ci
            $code = $LASTEXITCODE
          }
          $sw.Stop()
          "build_seconds=$([math]::Round($sw.Elapsed.TotalSeconds, 3))" | Add-Content reports/powder-toy/metadata.txt
          "build_exit_code=$code" | Add-Content reports/powder-toy/metadata.txt
          "configuration=MSVC x64 debugoptimized (O2 + debug info), static prebuilt deps, LTO" | Add-Content reports/powder-toy/metadata.txt
          exit $code

      - name: Collect PE/PDB metrics
        if: always()
        shell: pwsh
        run: |
          ./scripts/collect-pe-metrics.ps1 -Root target/build-ci -ExecutablePattern 'powder.exe' -OutDir reports/powder-toy -TargetName 'The Powder Toy v100.0.399 x64 O2+LTO'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powder-toy-v100.0.399-report
          path: reports/powder-toy

      - name: Preserve build failure status
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: exit 1
