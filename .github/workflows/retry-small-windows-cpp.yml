name: Retry TrafficMonitor on VS2022

on:
  pull_request:
    branches: [ci-small-base]

permissions:
  contents: read

jobs:
  trafficmonitor:
    name: TrafficMonitor Lite / VS2022 MSVC x64 Release
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Clone pinned source
        shell: pwsh
        run: |
          git clone https://github.com/zhongyang219/TrafficMonitor.git target
          git -C target checkout 5efd2159af8117301a2b6a755897aaa995887678
          git -C target submodule update --init --recursive
          New-Item -ItemType Directory -Force reports/trafficmonitor | Out-Null
          "commit=$(git -C target rev-parse HEAD)" | Set-Content reports/trafficmonitor/metadata.txt
          msbuild -version | Add-Content reports/trafficmonitor/metadata.txt

      - name: Build native v143/MFC configuration
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          msbuild target\TrafficMonitor_Lite.sln /m /p:Configuration="Release (lite)" /p:Platform=x64
          $code = $LASTEXITCODE
          $sw.Stop()
          "build_seconds=$([math]::Round($sw.Elapsed.TotalSeconds, 3))" | Add-Content reports/trafficmonitor/metadata.txt
          "build_exit_code=$code" | Add-Content reports/trafficmonitor/metadata.txt
          exit $code

      - name: Collect and print metrics
        shell: pwsh
        run: |
          ./scripts/collect-pe-metrics.ps1 -Root target -ExecutablePattern 'TrafficMonitor.exe' -OutDir reports/trafficmonitor -TargetName 'TrafficMonitor Lite x64 Release'
          Get-Content reports/trafficmonitor/pe-metrics.json

      - uses: actions/upload-artifact@v4
        with:
          name: trafficmonitor-vs2022-report
          path: reports/trafficmonitor
