name: Windows C++ release validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-cpp-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-cpp-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trafficmonitor:
    name: TrafficMonitor V1.86 / MSVC x64 Release
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Clone stable release tag
        shell: pwsh
        run: |
          git clone --branch V1.86 --depth 1 https://github.com/zhongyang219/TrafficMonitor.git target
          $head = (git -C target rev-parse HEAD).Trim()
          if ($head -ne '02a817a069bac6bf4d263b5209d9c1b07fe2f950') {
            throw "V1.86 resolved to unexpected commit: $head"
          }
          git -C target submodule update --init --recursive
          New-Item -ItemType Directory -Force reports/trafficmonitor | Out-Null
          "release=V1.86" | Set-Content reports/trafficmonitor/metadata.txt
          "commit=$head" | Add-Content reports/trafficmonitor/metadata.txt
          "submodules=$(@(git -C target submodule status --recursive).Count)" | Add-Content reports/trafficmonitor/metadata.txt
          $bytes = (Get-ChildItem target -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
          "clone_bytes=$bytes" | Add-Content reports/trafficmonitor/metadata.txt
          msbuild -version | Add-Content reports/trafficmonitor/metadata.txt

      - name: Build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          msbuild target\TrafficMonitor_Lite.sln /m /p:Configuration="Release (lite)" /p:Platform=x64
          $code = $LASTEXITCODE
          $sw.Stop()
          "build_seconds=$([math]::Round($sw.Elapsed.TotalSeconds, 3))" | Add-Content reports/trafficmonitor/metadata.txt
          "build_exit_code=$code" | Add-Content reports/trafficmonitor/metadata.txt
          exit $code

      - name: Collect PE/PDB metrics
        if: always()
        shell: pwsh
        run: |
          ./scripts/collect-pe-metrics.ps1 -Root target -ExecutablePattern 'TrafficMonitor.exe' -OutDir reports/trafficmonitor -TargetName 'TrafficMonitor V1.86 Lite x64 Release'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trafficmonitor-V1.86-report
          path: reports/trafficmonitor

      - name: Preserve build failure status
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: exit 1

  openloco:
    name: OpenLoco v26.07.1 / MSVC x64 Release
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Clone stable release tag
        shell: pwsh
        run: |
          git clone --branch v26.07.1 --depth 1 https://github.com/OpenLoco/OpenLoco.git target
          $head = (git -C target rev-parse HEAD).Trim()
          if ($head -ne '5c95820e2c022698f89908b8aade12423b1eef21') {
            throw "v26.07.1 resolved to unexpected commit: $head"
          }
          git -C target submodule update --init --recursive
          New-Item -ItemType Directory -Force reports/openloco | Out-Null
          "release=v26.07.1" | Set-Content reports/openloco/metadata.txt
          "commit=$head" | Add-Content reports/openloco/metadata.txt
          "submodules=$(@(git -C target submodule status --recursive).Count)" | Add-Content reports/openloco/metadata.txt
          $bytes = (Get-ChildItem target -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
          "clone_bytes=$bytes" | Add-Content reports/openloco/metadata.txt
          cmake --version | Add-Content reports/openloco/metadata.txt
          msbuild -version | Add-Content reports/openloco/metadata.txt

      - name: Configure and build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          Push-Location target
          cmake --preset windows -DOPENLOCO_BUILD_TESTS=OFF
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            cmake --build --preset windows-release --parallel
            $code = $LASTEXITCODE
          }
          Pop-Location
          $sw.Stop()
          "build_seconds=$([math]::Round($sw.Elapsed.TotalSeconds, 3))" | Add-Content reports/openloco/metadata.txt
          "build_exit_code=$code" | Add-Content reports/openloco/metadata.txt
          exit $code

      - name: Collect PE/PDB metrics
        if: always()
        shell: pwsh
        run: |
          ./scripts/collect-pe-metrics.ps1 -Root target -ExecutablePattern 'OpenLoco.exe' -OutDir reports/openloco -TargetName 'OpenLoco v26.07.1 x64 Release'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openloco-v26.07.1-report
          path: reports/openloco

      - name: Preserve build failure status
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: exit 1

  x64dbg:
    name: x64dbg 2026.05.27 / MSVC x64 Release
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Clone stable release tag and submodules
        shell: pwsh
        run: |
          git clone --branch 2026.05.27 --depth 1 https://github.com/x64dbg/x64dbg.git target
          $head = (git -C target rev-parse HEAD).Trim()
          if ($head -ne '9c8ca1cae0b6d56cc44f31fddcb10e3b02ffbb87') {
            throw "2026.05.27 resolved to unexpected commit: $head"
          }
          git -C target submodule sync --recursive
          git -C target submodule update --init --recursive --depth 1
          New-Item -ItemType Directory -Force reports/x64dbg | Out-Null
          "release=2026.05.27" | Set-Content reports/x64dbg/metadata.txt
          "commit=$head" | Add-Content reports/x64dbg/metadata.txt
          "submodules=$(@(git -C target submodule status --recursive).Count)" | Add-Content reports/x64dbg/metadata.txt
          $bytes = (Get-ChildItem target -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
          "clone_bytes=$bytes" | Add-Content reports/x64dbg/metadata.txt
          cmake --version | Add-Content reports/x64dbg/metadata.txt
          msbuild -version | Add-Content reports/x64dbg/metadata.txt

      - name: Configure and build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          cmake -S target -B target/build-ci -A x64
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            cmake --build target/build-ci --config Release --parallel
            $code = $LASTEXITCODE
          }
          $sw.Stop()
          "build_seconds=$([math]::Round($sw.Elapsed.TotalSeconds, 3))" | Add-Content reports/x64dbg/metadata.txt
          "build_exit_code=$code" | Add-Content reports/x64dbg/metadata.txt
          exit $code

      - name: Collect PE/PDB metrics
        if: always()
        shell: pwsh
        run: |
          ./scripts/collect-pe-metrics.ps1 -Root target -ExecutablePattern 'x64dbg.exe' -OutDir reports/x64dbg -TargetName 'x64dbg 2026.05.27 x64 Release'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x64dbg-2026.05.27-report
          path: reports/x64dbg

      - name: Preserve build failure status
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: exit 1

  windows-terminal:
    name: Windows Terminal v1.24.11321.0 OpenConsole / MSVC x64 Release
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Clone stable release tag
        shell: pwsh
        run: |
          git clone --branch v1.24.11321.0 --depth 1 https://github.com/microsoft/terminal.git target
          $head = (git -C target rev-parse HEAD).Trim()
          if ($head -ne 'b4e69c68620a822407d45bfbba6ee10feebc70a3') {
            throw "v1.24.11321.0 resolved to unexpected commit: $head"
          }
          git -C target submodule update --init --recursive
          New-Item -ItemType Directory -Force reports/windows-terminal | Out-Null
          "release=v1.24.11321.0" | Set-Content reports/windows-terminal/metadata.txt
          "commit=$head" | Add-Content reports/windows-terminal/metadata.txt
          "submodules=$(@(git -C target submodule status --recursive).Count)" | Add-Content reports/windows-terminal/metadata.txt
          $bytes = (Get-ChildItem target -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
          "clone_bytes=$bytes" | Add-Content reports/windows-terminal/metadata.txt
          msbuild -version | Add-Content reports/windows-terminal/metadata.txt
          & 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe' -latest -prerelease -format json | Set-Content reports/windows-terminal/vswhere.json

      - name: Build OpenConsole
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          Push-Location target
          Import-Module .\tools\OpenConsole.psm1
          Set-MsbuildDevEnvironment -Prerelease
          Invoke-OpenConsoleBuild /m /p:Configuration=Release /p:Platform=x64
          $code = $LASTEXITCODE
          Pop-Location
          $sw.Stop()
          "build_seconds=$([math]::Round($sw.Elapsed.TotalSeconds, 3))" | Add-Content reports/windows-terminal/metadata.txt
          "build_exit_code=$code" | Add-Content reports/windows-terminal/metadata.txt
          exit $code

      - name: Collect PE/PDB metrics
        if: always()
        shell: pwsh
        run: |
          ./scripts/collect-pe-metrics.ps1 -Root target -ExecutablePattern 'OpenConsole.exe' -OutDir reports/windows-terminal -TargetName 'Windows Terminal v1.24.11321.0 OpenConsole x64 Release'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-terminal-v1.24.11321.0-report
          path: reports/windows-terminal

      - name: Preserve build failure status
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: exit 1
