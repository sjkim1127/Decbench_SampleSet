name: WinSparkle qualification status probe

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["WinSparkle native MSVC qualification"]
    types: [requested, in_progress, completed]

permissions:
  actions: read
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Query recent WinSparkle qualification runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/msvc-winsparkle-validation.yml/runs?branch=main&per_page=10" \
            --jq '{workflow_runs: [.workflow_runs[] | {id, run_number, run_attempt, event, status, conclusion, head_sha, created_at, updated_at, html_url}]}' \
            > winsparkle-run-status.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('winsparkle-run-status.json')
          runs = json.loads(path.read_text())['workflow_runs']
          if not runs:
              raise SystemExit('No WinSparkle qualification runs found')

          out = {
              'schema': 'decbench-github-actions-run-status-v2',
              'target': 'WinSparkle v0.9.4',
              'workflow': 'msvc-winsparkle-validation.yml',
              'latest': runs[0],
              'recent_runs': runs,
          }
          path.write_text(json.dumps(out, indent=2) + '\n', encoding='utf-8')

          latest = runs[0]
          summary = Path(__import__('os').environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a', encoding='utf-8') as f:
              f.write('## WinSparkle qualification status\n\n')
              f.write(f"- Run: `{latest['id']}` (#{latest['run_number']}, attempt {latest['run_attempt']})\n")
              f.write(f"- Status: `{latest['status']}`\n")
              f.write(f"- Conclusion: `{latest['conclusion']}`\n")
              f.write(f"- Head: `{latest['head_sha']}`\n")
              f.write(f"- URL: {latest['html_url']}\n")
          PY

      - name: Upload status snapshot
        uses: actions/upload-artifact@v4
        with:
          name: winsparkle-run-status-${{ github.run_id }}
          path: winsparkle-run-status.json
          if-no-files-found: error
          retention-days: 7
