name: WinSparkle qualification status probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/winsparkle-status-probe.yml"
  workflow_run:
    workflows: ["WinSparkle native MSVC qualification"]
    types: [requested, in_progress, completed]

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout qualification workspace
        uses: actions/checkout@v4

      - name: Query recent WinSparkle qualification runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/evidence/msvc/winsparkle
          gh api \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/msvc-winsparkle-validation.yml/runs?branch=main&per_page=10" \
            --jq '{workflow_runs: [.workflow_runs[] | {id, run_number, run_attempt, event, status, conclusion, head_sha, created_at, updated_at, html_url}]}' \
            > /tmp/runs.json
          python - <<'PY'
          import json
          from pathlib import Path

          runs = json.loads(Path('/tmp/runs.json').read_text())['workflow_runs']
          if not runs:
              raise SystemExit('No WinSparkle qualification runs found')
          out = {
              'schema': 'decbench-github-actions-run-status-v2',
              'target': 'WinSparkle v0.9.4',
              'workflow': 'msvc-winsparkle-validation.yml',
              'latest': runs[0],
              'recent_runs': runs,
          }
          Path('results/evidence/msvc/winsparkle/run-status.json').write_text(
              json.dumps(out, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Commit status snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/evidence/msvc/winsparkle/run-status.json
          if git diff --cached --quiet; then
            echo "WinSparkle status snapshot unchanged"
            exit 0
          fi
          git commit -m "ci: snapshot WinSparkle qualification status"
          git push origin HEAD:main
