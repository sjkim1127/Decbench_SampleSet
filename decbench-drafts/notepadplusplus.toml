# Draft DecBench project config — Windows C++ / MinGW compatibility-first path.
# Requires g++-mingw-w64 in docker/compile.Dockerfile.

name = "notepadplusplus"
version = "v8.9.6.1"

source_remote = "https://github.com/notepad-plus-plus/notepad-plus-plus"
remote_type = "git"
package_dir = "notepadplusplus"
source_dir = "."

apply_patch = "notepadplusplus-decbench.patch"
post_download_cmds = []
pre_make_cmds = []

# The upstream GCC makefile already supports CROSS_COMPILE. The small target
# patch removes its hard-coded -O3/-s release choices and routes DecBench's
# selected optimization/debug flags through DECBENCH_CXXFLAGS.
make_cmd = 'DECBENCH_CXXFLAGS="$CFLAGS" CROSS_COMPILE=x86_64-w64-mingw32- make -f PowerEditor/gcc/makefile -j2'

labels = ["cpp", "windows", "pe", "mingw", "desktop"]

[compilation]
optimization_levels = ["O0", "O2", "O2-noinline"]
base_flags = ["-g", "-fno-builtin", "-save-temps=obj"]
c_compiler = "x86_64-w64-mingw32-gcc"
cpp_compiler = "x86_64-w64-mingw32-g++"
target_arch = "x86-64"
