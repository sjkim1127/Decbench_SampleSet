# DecBench candidate: Ninja
# Stable release pin: v1.13.1
# Resolved upstream commit: 79feac0f3e3bc9da9effc586cd5fea41e7550051

name = "ninja"
version = "v1.13.1"
source_remote = "https://github.com/ninja-build/ninja"
remote_type = "git"
package_dir = "ninja"
source_dir = "."

post_download_cmds = []

# Keep DecBench in control of optimization. An unset CMAKE_BUILD_TYPE avoids
# Ninja's Release IPO/LTO path, while BUILD_TESTING=OFF prevents test/perftest
# targets and their dependencies from contaminating the corpus.
pre_make_cmds = [
  'cmake -S . -B build -DCMAKE_BUILD_TYPE= -DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_FLAGS="$CFLAGS" -DBUILD_TESTING=OFF',
]

# Build only the real Ninja executable and discard all CMake compiler probe/test artifacts
# (e.g. build/CMakeFiles/[0-9]* and build/CMakeFiles/_*) while preserving
# build/CMakeFiles/ninja.dir/*.ii preprocessed source units.
make_cmd = 'cmake --build build -j --target ninja && rm -rf build/CMakeFiles/[0-9]* build/CMakeFiles/_*'

labels = ["cpp", "executable", "system", "tooling"]

[compilation]
optimization_levels = ["O0", "O2", "O2-noinline"]
base_flags = ["-g", "-fno-builtin", "-save-temps=obj"]
c_compiler = "gcc"
# DecBench currently does not wire cpp_compiler into the generic build env;
# CMake selects g++ explicitly above.
cpp_compiler = "g++"
