# Experimental DecBench Windows/MSVC validation config.
# This is metadata for the PR #36-style MSVC/PDB path and is NOT consumed by
# the current DecBench Project.from_toml GCC/DWARF pipeline.

schema = "decbench-msvc-candidate-v1"
name = "detours"
version = "v4.0.1"
source_remote = "https://github.com/microsoft/Detours"
resolved_commit = "e4bfd6b03e50de46b47abfbd1e46b384f0c5f833"
language = "C++ / Win32"
intended_role = "Windows instrumentation / PE manipulation / systems"

[source]
include = [
  "src/detours.cpp",
  "src/modules.cpp",
  "src/disasm.cpp",
  "src/image.cpp",
  "src/creatwth.cpp",
]
exclude = ["samples/**", "tests/**"]

[build]
system = "MSVC + NMAKE"
toolchain = "cl.exe + link.exe under the DecBench PR #36/Wine environment"
requires_adapter = true
linked_images = ["withdll.exe", "dumpe.exe", "disas.exe", "findfunc.exe"]
notes = [
  "The core upstream output is detours.lib; benchmark validation should retain only explicitly selected linked PE sample/tool images.",
  "The upstream makefiles default to /Od, so the adapter must override optimization flags rather than trusting upstream configurations.",
]

[ground_truth]
format = "PDB / CodeView"
require_pdb = true
source_filter = "Keep project-owned Detours compilation units; exclude unrelated sample/vendor units unless the selected wrapper is intentionally part of the target."

[optimization.O0]
compile_flags = ["/Od", "/Ob0", "/Zi"]
link_flags = ["/DEBUG"]

[optimization.O2]
compile_flags = ["/O2", "/Zi"]
link_flags = ["/DEBUG"]

[optimization."O2-noinline"]
compile_flags = ["/O2", "/Ob0", "/Zi"]
link_flags = ["/DEBUG"]

[validation]
require_linked_pe = true
require_ground_truth = true
measure_short_name_collisions = true
record_compiland_ownership = true
